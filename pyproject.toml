[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell_phone_modifier"
version = "1.0.0"
description = "Herramienta CLI y Dashboard local para gestionar dispositivos Android"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "flask>=3.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "textual>=0.50.0",
    "requests>=2.31.0",
]

[project.scripts]
cpm = "main:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "web*"]
