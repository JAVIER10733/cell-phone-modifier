# Configuración de logging para cell_phone_modifier
# Usado por el módulo logger.py (opcional, el logger actual usa código)

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  simple:
    format: "%(levelname)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  
  file_app:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/app.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf-8
  
  file_errors:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 5242880  # 5 MB
    backupCount: 3
    encoding: utf-8
  
  file_audit:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/audit.log
    maxBytes: 5242880  # 5 MB
    backupCount: 3
    encoding: utf-8

loggers:
  cell_phone_modifier:
    level: INFO
    handlers: [console, file_app, file_errors]
    propagate: false
  
  cell_phone_modifier.audit:
    level: INFO
    handlers: [file_audit]
    propagate: false
  
  cell_phone_modifier.adb:
    level: DEBUG
    handlers: [file_app]
    propagate: false
  
  cell_phone_modifier.fastboot:
    level: DEBUG
    handlers: [file_app]
    propagate: false
  
  cell_phone_modifier.modules:
    level: INFO
    handlers: [file_app, file_errors]
    propagate: false

root:
  level: WARNING
  handlers: [console, file_errors]